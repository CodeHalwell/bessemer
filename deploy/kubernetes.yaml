# Example only: replace the immutable image reference and configure its domain.
# Create bessemer-api-key through your secret manager before applying this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bessemer
spec:
  replicas: 2
  selector:
    matchLabels: {app: bessemer}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: bessemer}
    spec:
      terminationGracePeriodSeconds: 25
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bessemer
          image: registry.example.com/team/bessemer-service@sha256:REPLACE_WITH_QUALIFIED_DIGEST
          args: [run, "examples.production:app", --host, 0.0.0.0, --port, "8000"]
          ports:
            - {name: http, containerPort: 8000}
          env:
            - name: BESSEMER_EXAMPLE_API_KEY
              valueFrom:
                secretKeyRef: {name: bessemer-api-key, key: api-key}
            - {name: BESSEMER_WORKERS, value: "1"}
            - {name: BESSEMER_MAX_IN_FLIGHT, value: "64"}
            - {name: BESSEMER_MAX_CONNECTIONS, value: "256"}
            - {name: BESSEMER_REQUEST_TIMEOUT, value: "10"}
            - {name: BESSEMER_GRACEFUL_TIMEOUT, value: "20"}
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: temporary, mountPath: /tmp}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders: [{name: Host, value: "127.0.0.1"}]
            periodSeconds: 1
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders: [{name: Host, value: "127.0.0.1"}]
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders: [{name: Host, value: "127.0.0.1"}]
            periodSeconds: 5
            timeoutSeconds: 2
      volumes:
        - name: temporary
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: bessemer
spec:
  selector: {app: bessemer}
  ports:
    - {name: http, port: 80, targetPort: http}
  type: ClusterIP
