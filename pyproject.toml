[build-system]
requires = ["maturin==1.9.6"]
build-backend = "maturin"

[project]
name = "bessemer"
version = "0.2.0a3"
description = "A Rust HTTP runtime with a Python application API"
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
]

[project.scripts]
bessemer = "bessemer.cli:main"

[project.optional-dependencies]
pydantic = ["pydantic>=2.10.6,<3"]
dev = ["maturin==1.9.6", "ruff==0.17.3"]

[tool.maturin]
python-source = "python"
module-name = "bessemer._native"
features = ["extension-module"]
