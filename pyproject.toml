[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "bessemer"
version = "1.0.0rc1"
description = "A Rust HTTP runtime with a Python application API"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
  "Programming Language :: Rust",
]

[project.urls]
Repository = "https://github.com/CodeHalwell/bessemer"
Changelog = "https://github.com/CodeHalwell/bessemer/blob/main/CHANGELOG.md"
Documentation = "https://github.com/CodeHalwell/bessemer/tree/main/docs"

[project.scripts]
bessemer = "bessemer.cli:main"

[project.optional-dependencies]
pydantic = ["pydantic>=2.10.6,<3"]
ag-ui = ["ag-ui-protocol>=1,<2"]
otel = ["opentelemetry-api>=1.27,<2"]
# The tests exercise the OpenTelemetry context hand-off with the real API.
dev = ["maturin==1.16.0", "ruff==0.17.3", "opentelemetry-api==1.45.2"]

[tool.maturin]
python-source = "python"
module-name = "bessemer._native"
features = ["extension-module"]
# Keep recorded qualification evidence in Git, not in the source distribution.
exclude = [
  { path = "benchmarks/results/**/*", format = "sdist" },
  { path = "deploy/qualification/**/*", format = "sdist" },
  { path = "tests/security/results/**/*", format = "sdist" },
]
