[package]
name = "bessemer-codec"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
itoa = "1"
pyo3 = "0.29"
zmij = "1"
serde_json = { version = "1", features = ["arbitrary_precision"] }

[dev-dependencies]
pyo3 = { version = "0.29", features = ["auto-initialize"] }

[build-dependencies]
pyo3-build-config = "0.29"
