name: Cross-platform performance

# Server CPU per request and req/s from benchmarks/portable/measure.py, the
# same harness on each operating system, so macOS and Windows can be
# compared with Linux on similar runners. Information only:
# callgrind, which the Linux gate in perf.yml relies on, has no macOS or
# Windows equivalent, and wall-clock CPU time on shared runners moves by
# several percent between runs.

on:
  pull_request:
    paths:
      - ".github/workflows/portable-perf.yml"
      - "benchmarks/portable/**"
      - "benchmarks/compare/bessemer_app.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "crates/**"
      - "python/bessemer/**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  measure:
    name: Cross-platform performance / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            oha: oha-linux-amd64
            sha256: 620bb9e16fb53eabc9a3fc45f88bdb41fefa3fee5c05e75892011ce320391716
          - name: macOS arm64
            os: macos-15
            oha: oha-macos-arm64
            sha256: 7dea53ecb8342a7a067e1976fd0aef44ac33d9cc6b1e65c53637ffb932da63c4
          - name: macOS x86_64
            os: macos-15-intel
            oha: oha-macos-amd64
            sha256: 5ecbfc5233e3f1d30384e142a9a8dd7ebf9d3298ab22476fabac44a8f2117e08
          - name: Windows x86_64
            os: windows-2022
            oha: oha-windows-amd64.exe
            sha256: d692d392e958e7e8e1b16810287e74a835a62255b079ba2766a4b3b04499f267
    env:
      CARGO_TERM_COLOR: always
      RUST_VERSION: "1.92.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Install the load generator
        run: |
          oha="$RUNNER_TEMP/${{ matrix.oha }}"
          curl --fail --location --retry 3 \
            "https://github.com/hatoo/oha/releases/download/v1.16.0/${{ matrix.oha }}" \
            --output "$oha"
          python -c "import hashlib, sys; d = hashlib.sha256(open(sys.argv[1], 'rb').read()).hexdigest(); sys.exit(d != sys.argv[2])" \
            "$oha" "${{ matrix.sha256 }}"
          chmod +x "$oha"
      - name: Build and install wheel
        run: |
          python -m pip install --disable-pip-version-check maturin==1.9.6 psutil==7.2.2
          maturin build --release --locked --features extension-module --interpreter python --out target/wheels
          python -m pip install --disable-pip-version-check target/wheels/*.whl 'pydantic>=2.10.6,<3'
      - name: Measure
        run: >-
          python benchmarks/portable/measure.py --oha "$RUNNER_TEMP/${{ matrix.oha }}"
          --out "$RUNNER_TEMP/portable-perf.json" --markdown "$GITHUB_STEP_SUMMARY"
          --title "Server CPU per request, ${{ matrix.name }}"
          --loops asyncio,bessemer --workers 1,2 --routes json,items,echo
      - name: Measure one supervised worker
        # Separates the cost of the supervisor's process model from the cost
        # of a second worker: one worker under bessemer run, against the
        # in-process figure above.
        run: >-
          python benchmarks/portable/measure.py --oha "$RUNNER_TEMP/${{ matrix.oha }}"
          --out "$RUNNER_TEMP/portable-perf-supervised.json" --markdown "$GITHUB_STEP_SUMMARY"
          --title "One supervised worker, ${{ matrix.name }}"
          --loops asyncio --workers 1 --routes json --cli
      - name: Measure workers at a fixed rate
        # Below saturation on every runner, so CPU per request compares
        # worker counts without the cost of oversubscribed cores.
        run: >-
          python benchmarks/portable/measure.py --oha "$RUNNER_TEMP/${{ matrix.oha }}"
          --out "$RUNNER_TEMP/portable-perf-rate.json" --markdown "$GITHUB_STEP_SUMMARY"
          --title "Workers at 15,000 req/s, ${{ matrix.name }}"
          --loops asyncio --workers 1,2,4 --routes json --cli --rate 15000
      - name: Preserve measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-perf-${{ matrix.os }}
          path: ${{ runner.temp }}/portable-perf*.json
          if-no-files-found: warn
