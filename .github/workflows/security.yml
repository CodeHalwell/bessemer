name: Dependency security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.12.21'
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
      - name: Audit Python dependencies
        run: |
          uv pip compile pyproject.toml --extra dev --extra pydantic --extra otel -o /tmp/bessemer-audit.txt
          printf '%s\n' 'pydantic==2.10.6' > /tmp/bessemer-constraints.txt
          printf '%s\n' 'starlette==1.7.0' 'itsdangerous==2.2.0' 'uvloop==0.23.0' > /tmp/bessemer-ci-extra.in
          uv pip compile pyproject.toml /tmp/bessemer-ci-extra.in --extra dev --extra pydantic --extra otel --constraint /tmp/bessemer-constraints.txt -o /tmp/bessemer-minimum.txt
          for requirements in /tmp/bessemer-audit.txt /tmp/bessemer-minimum.txt deploy/requirements-production.lock deploy/requirements-installer.lock; do
            uvx --from pip-audit==2.10.1 pip-audit --requirement "$requirements" --no-deps --disable-pip --progress-spinner off
          done
