name: Release

# Runs only when a maintainer pushes a version tag such as v1.0.0 or v1.0.0rc1.
# Publishing to PyPI uses Trusted Publishing from the protected "pypi"
# environment, so a tag push alone cannot publish without that environment's
# approval rules.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: "1.92.0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  metadata:
    name: Check tag matches package version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - id: version
        run: python scripts/release_version.py --tag "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"

  sdist:
    name: Source distribution
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: PyO3/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad # v1.50.1
        with:
          maturin-version: "1.9.6"
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: Linux x86_64 wheel / Python ${{ matrix.python }}
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - python: "3.12"
            pydantic: "==2.10.6"
          - python: "3.13"
            pydantic: ">=2.10.6,<3"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build manylinux wheel
        uses: PyO3/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad # v1.50.1
        with:
          maturin-version: "1.9.6"
          rust-toolchain: ${{ env.RUST_VERSION }}
          target: x86_64
          manylinux: "2_28"
          args: >-
            --release --locked --features extension-module
            --interpreter python${{ matrix.python }} --out dist
      - name: Set up Rust for source checks
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"
      - name: Install the exact release wheel and check it
        env:
          BESSEMER_REQUIRE_NATIVE: "1"
        run: |
          python -m pip install --disable-pip-version-check ruff==0.17.3 'pydantic${{ matrix.pydantic }}' opentelemetry-api==1.45.0
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import bessemer, sys; assert bessemer.__version__ == sys.argv[1], bessemer.__version__" \
            "${{ needs.metadata.outputs.version }}"
          ./scripts/check.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-wheel-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [metadata, sdist, wheels]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/bessemer/${{ needs.metadata.outputs.version }}/
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

  github-release:
    name: Create GitHub release
    needs: [metadata, publish-pypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Write checksums and release notes
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          python scripts/release_version.py --tag "$GITHUB_REF_NAME" --notes release-notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "Bessemer $GITHUB_REF_NAME" --notes-file release-notes.md "${flags[@]}"
