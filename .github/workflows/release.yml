name: Release

# Publishes only when a maintainer pushes a version tag such as v1.0.0 or
# v1.0.0rc1. Publishing to PyPI uses Trusted Publishing from the protected
# "pypi" environment, so a tag push alone cannot publish without that
# environment's approval rules. Running it by hand (workflow_dispatch), or on a
# pull request that changes packaging, is a dry run: it builds and tests every
# artifact and stops before publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/release_version.py"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: "1.92.0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  metadata:
    name: Check tag matches package version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python scripts/release_version.py --tag "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"
          else
            python scripts/release_version.py --github-output "$GITHUB_OUTPUT"
          fi

  sdist:
    name: Source distribution
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad # v1.50.1
        with:
          maturin-version: "1.9.6"
          command: sdist
          args: --out dist
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build and import the sdist in a clean environment
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/pip" install --disable-pip-version-check dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdist-venv/bin/python" -c "import bessemer, bessemer._native, sys; assert bessemer.__version__ == sys.argv[1]" \
            "${{ needs.metadata.outputs.version }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: Linux x86_64 wheel / Python ${{ matrix.python }}
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - python: "3.12"
            pydantic: "==2.10.6"
          - python: "3.13"
            pydantic: ">=2.10.6,<3"
          # Free-threaded CPython, qualified in CI with the same suite.
          - python: "3.14t"
            pydantic: ">=2.12,<3"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build manylinux wheel
        uses: PyO3/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad # v1.50.1
        with:
          maturin-version: "1.9.6"
          rust-toolchain: ${{ env.RUST_VERSION }}
          target: x86_64
          manylinux: "2_28"
          args: >-
            --release --locked --features extension-module
            --interpreter python${{ matrix.python }} --out dist
      - name: Set up Rust for source checks
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"
      - name: Precompile the interpreter's standard library
        # As in check.yml: without standard library bytecode the supervisor
        # tests' short-lived fake workers can miss their startup deadline.
        run: python -c "import compileall, sysconfig; compileall.compile_dir(sysconfig.get_paths()['stdlib'], quiet=2, workers=0)" || true
      - name: Install Redis for shared rate limit tests
        run: sudo apt-get update -q && sudo apt-get install -y -q redis-server
      - name: Install the exact release wheel and check it
        env:
          BESSEMER_REQUIRE_NATIVE: "1"
          BESSEMER_REQUIRE_REDIS: "1"
        run: |
          python -m pip install --disable-pip-version-check ruff==0.17.3 'pydantic${{ matrix.pydantic }}' \
            opentelemetry-api==1.45.1 starlette==1.7.0 itsdangerous==2.2.0
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import bessemer, sys; assert bessemer.__version__ == sys.argv[1], bessemer.__version__" \
            "${{ needs.metadata.outputs.version }}"
          ./scripts/check.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-wheel-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  native-wheels:
    # macOS arm64 and x86_64, and Windows x86_64, each built on its own runner
    # and tested with the Python suite before it can be published.
    name: ${{ matrix.os }} wheel / Python ${{ matrix.python }}
    needs: metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        os: [macos-15, macos-15-intel, windows-2022]
        python: ["3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Build wheel
        run: |
          python -m pip install --disable-pip-version-check maturin==1.9.6
          maturin build --release --locked --features extension-module --interpreter python --out dist
      - name: Precompile the interpreter's standard library
        run: python -c "import compileall, sysconfig; compileall.compile_dir(sysconfig.get_paths()['stdlib'], quiet=2, workers=0)" || true
      - name: Install the exact release wheel and test it
        env:
          BESSEMER_REQUIRE_NATIVE: "1"
        run: |
          python -m pip install --disable-pip-version-check 'pydantic>=2.10.6,<3' \
            opentelemetry-api==1.45.1 starlette==1.7.0 itsdangerous==2.2.0
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import bessemer, sys; assert bessemer.__version__ == sys.argv[1], bessemer.__version__" \
            "${{ needs.metadata.outputs.version }}"
          python -m unittest discover -s tests/python -p 'test_*.py'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-wheel-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [metadata, sdist, wheels, native-wheels]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/bessemer/${{ needs.metadata.outputs.version }}/
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

  github-release:
    name: Create GitHub release
    needs: [metadata, publish-pypi]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Write checksums and release notes
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          python scripts/release_version.py --tag "$GITHUB_REF_NAME" --notes release-notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "Bessemer $GITHUB_REF_NAME" --notes-file release-notes.md "${flags[@]}"
