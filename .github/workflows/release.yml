name: Release

# Releases when the package version on main changes. A push to main whose
# version has no v-tag yet builds and tests every artifact, publishes to PyPI,
# then creates the tag and the GitHub release on that exact commit. A push to
# main whose version is already tagged stops after the version check. Pushing
# a version tag by hand still releases that tag, as before.
#
# Publishing to PyPI uses Trusted Publishing from the protected "pypi"
# environment, so nothing is uploaded without that environment's approval.
# Running it by hand (workflow_dispatch), or on a pull request that changes
# packaging, is a dry run: it builds and tests every artifact and stops before
# publishing.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/release_version.py"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: "1.92.0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  metadata:
    name: Check tag matches package version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag: ${{ steps.release.outputs.tag }}
      release: ${{ steps.release.outputs.release }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python scripts/release_version.py --tag "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"
          else
            python scripts/release_version.py --github-output "$GITHUB_OUTPUT"
          fi
      - id: release
        # release: publish this run. build: build and test the artifacts
        # (every run except a main push whose version is already tagged).
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          tag="v$VERSION"
          release=false
          build=true
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            release=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            # Exit status 2 means no such tag; anything else but 0 is an error.
            status=0
            git ls-remote --exit-code --tags "$REPOSITORY" "refs/tags/$tag" >/dev/null || status=$?
            if [[ $status == 0 ]]; then
              echo "$tag already exists; nothing to release."
              build=false
            elif [[ $status == 2 ]]; then
              echo "$tag does not exist yet; releasing $VERSION from $GITHUB_SHA."
              release=true
            else
              echo "could not list tags (git exit status $status)" >&2
              exit 1
            fi
          fi
          {
            echo "tag=$tag"
            echo "release=$release"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

  sdist:
    name: Source distribution
    needs: metadata
    if: needs.metadata.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "1.9.6"
          command: sdist
          args: --out dist
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build and import the sdist in a clean environment
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/pip" install --disable-pip-version-check dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdist-venv/bin/python" -c "import bessemer, bessemer._native, sys; assert bessemer.__version__ == sys.argv[1]" \
            "${{ needs.metadata.outputs.version }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: Linux x86_64 wheel / Python ${{ matrix.python }}
    needs: metadata
    if: needs.metadata.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - python: "3.12"
            pydantic: "==2.10.6"
            ag_ui: ""
          - python: "3.13"
            pydantic: ">=2.10.6,<3"
            ag_ui: "ag-ui-protocol==1.0.0"
          # Free-threaded CPython, qualified in CI with the same suite.
          - python: "3.14t"
            pydantic: ">=2.12,<3"
            ag_ui: "ag-ui-protocol==1.0.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build manylinux wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "1.9.6"
          rust-toolchain: ${{ env.RUST_VERSION }}
          target: x86_64
          manylinux: "2_28"
          args: >-
            --release --locked --features extension-module
            --interpreter python${{ matrix.python }} --out dist
      - name: Set up Rust for source checks
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"
      - name: Precompile the interpreter's standard library
        # As in check.yml: without standard library bytecode the supervisor
        # tests' short-lived fake workers can miss their startup deadline.
        run: python -c "import compileall, sysconfig; compileall.compile_dir(sysconfig.get_paths()['stdlib'], quiet=2, workers=0)" || true
      - name: Install Redis for shared rate limit tests
        run: sudo apt-get update -q && sudo apt-get install -y -q redis-server
      - name: Install the exact release wheel and check it
        env:
          BESSEMER_REQUIRE_NATIVE: "1"
          BESSEMER_REQUIRE_REDIS: "1"
          BESSEMER_REQUIRE_AG_UI: ${{ matrix.python != '3.12' && '1' || '0' }}
        run: |
          python -m pip install --disable-pip-version-check ruff==0.17.3 'pydantic${{ matrix.pydantic }}' \
            opentelemetry-api==1.45.1 starlette==1.7.0 itsdangerous==2.2.0 ${{ matrix.ag_ui }}
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import bessemer, sys; assert bessemer.__version__ == sys.argv[1], bessemer.__version__" \
            "${{ needs.metadata.outputs.version }}"
          ./scripts/check.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-wheel-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  native-wheels:
    # macOS arm64 and x86_64, and Windows x86_64, each built on its own runner
    # and tested with the Python suite before it can be published.
    name: ${{ matrix.os }} wheel / Python ${{ matrix.python }}
    needs: metadata
    if: needs.metadata.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        os: [macos-15, macos-15-intel, windows-2022]
        python: ["3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Build wheel
        run: |
          python -m pip install --disable-pip-version-check maturin==1.9.6
          maturin build --release --locked --features extension-module --interpreter python --out dist
      - name: Precompile the interpreter's standard library
        run: python -c "import compileall, sysconfig; compileall.compile_dir(sysconfig.get_paths()['stdlib'], quiet=2, workers=0)" || true
      - name: Install the exact release wheel and test it
        env:
          BESSEMER_REQUIRE_NATIVE: "1"
          BESSEMER_REQUIRE_AG_UI: "1"
        run: |
          python -m pip install --disable-pip-version-check 'pydantic>=2.10.6,<3' \
            opentelemetry-api==1.45.1 starlette==1.7.0 itsdangerous==2.2.0 ag-ui-protocol==1.0.0
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import bessemer, sys; assert bessemer.__version__ == sys.argv[1], bessemer.__version__" \
            "${{ needs.metadata.outputs.version }}"
          python -m unittest discover -s tests/python -p 'test_*.py'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-wheel-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [metadata, sdist, wheels, native-wheels]
    if: needs.metadata.outputs.release == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/bessemer/${{ needs.metadata.outputs.version }}/
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
          # A re-run after the GitHub release step failed finds the files
          # already on PyPI; skip them so the run can go on to tag and release.
          skip-existing: true

  github-release:
    name: Create GitHub release
    needs: [metadata, publish-pypi]
    if: needs.metadata.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Write checksums and release notes
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          python scripts/release_version.py --tag "$TAG" --notes release-notes.md
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
      - name: Publish release
        # On a main push the tag does not exist yet: the release creates it
        # on the tested commit. The tag is made with GITHUB_TOKEN, so it does
        # not start this workflow a second time.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.metadata.outputs.tag }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            flags+=(--verify-tag)
          else
            flags+=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" dist/* \
            --title "Bessemer $TAG" --notes-file release-notes.md "${flags[@]}"
