name: macOS and Windows

# Builds the wheel and runs the Python suite on macOS (arm64 and Intel) and
# Windows, the same platforms release.yml builds wheels for.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portability:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2022]
        python: ["3.12", "3.13"]
    env:
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: "1"
      RUST_VERSION: "1.92.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Build and install wheel
        run: |
          python -m pip install --disable-pip-version-check maturin==1.9.6
          maturin build --release --locked --features extension-module --interpreter python --out target/wheels
          python -m pip install --force-reinstall target/wheels/*.whl
      - name: Import the native extension
        run: python -c "import bessemer, bessemer._native; print(bessemer.__version__)"
      - name: Install optional runtimes
        run: python -m pip install 'pydantic>=2.10.6,<3' opentelemetry-api==1.45.1 starlette==1.7.0 itsdangerous==2.2.0
      - name: Precompile the interpreter's standard library
        # As in check.yml: without standard library bytecode the supervisor
        # tests' short-lived fake workers miss their 0.3 s startup deadline.
        run: python -c "import compileall, sysconfig; compileall.compile_dir(sysconfig.get_paths()['stdlib'], quiet=2, workers=0)" || true
      - name: Python test suite
        env:
          BESSEMER_REQUIRE_NATIVE: "1"
        # A watchdog dumps every thread's stack and exits if the suite hangs,
        # and -v names each test as it starts, so a hang names its test.
        run: |
          python -X faulthandler -c "import faulthandler, sys, unittest; faulthandler.dump_traceback_later(900, exit=True); unittest.main(module=None, argv=['unittest', 'discover', '-v', '-s', 'tests/python', '-p', 'test_*.py'])" > target/tests.log 2>&1 && status=0 || status=$?
          grep -E '^(FAIL|ERROR):' target/tests.log | head -120 || true
          # Full tracebacks for anything that failed.
          sed -n '/^======/,/^Ran /p' target/tests.log | head -1500
          if ! grep -q '^Ran ' target/tests.log; then
            echo "The suite did not finish; the end of its log:"
            tail -120 target/tests.log
          fi
          tail -5 target/tests.log
          exit $status
