name: Check and build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Linux / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: "1"
      RUST_VERSION: "1.92.0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"
      - name: Install build tool
        run: python -m pip install --disable-pip-version-check maturin==1.9.6
      - name: Build and install wheel
        run: |
          maturin build --release --locked --features extension-module --interpreter python --out target/wheels
          python -m pip install --force-reinstall target/wheels/*.whl
      - name: Check source and installed package
        env:
          BESSEMER_REQUIRE_NATIVE: "1"
        run: ./scripts/check.sh
      - name: Preserve tested wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-python-${{ matrix.python }}-wheel
          path: target/wheels/*.whl
          if-no-files-found: error
