name: Check and build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Linux / Python ${{ matrix.python }} / Pydantic ${{ matrix.pydantic }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            pydantic: "==2.10.6"
          - python: "3.13"
            pydantic: ">=2.10.6,<3"
          # Free-threaded CPython: the extension runs without the GIL here.
          - python: "3.14t"
            pydantic: ">=2.12,<3"
    env:
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: "1"
      RUST_VERSION: "1.92.0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"
      - name: Install build tool
        run: python -m pip install --disable-pip-version-check maturin==1.9.6 ruff==0.17.3
      - name: Build and install wheel
        run: |
          maturin build --release --locked --features extension-module --interpreter python --out target/wheels
          python -m pip install --force-reinstall target/wheels/*.whl
      - name: Install optional validation and tracing runtimes
        run: python -m pip install 'pydantic${{ matrix.pydantic }}' opentelemetry-api==1.45.0 starlette==1.7.0 itsdangerous==2.2.0
      - name: Precompile the interpreter's standard library
        # The checks run with PYTHONDONTWRITEBYTECODE, so an interpreter
        # shipped without standard library bytecode recompiles every module on
        # each start. That makes the supervisor tests' short-lived fake workers
        # miss their 0.3 s startup deadline. The return value is ignored on
        # purpose: the standard library carries deliberately invalid test files.
        run: |
          python -c "import time; t = time.perf_counter(); import argparse, json, subprocess; print(f'imports before: {time.perf_counter() - t:.3f}s')"
          python -c "import compileall, sysconfig; compileall.compile_dir(sysconfig.get_paths()['stdlib'], quiet=2, workers=0)" || true
          python -c "import time; t = time.perf_counter(); import argparse, json, subprocess; print(f'imports after: {time.perf_counter() - t:.3f}s')"
      - name: Install Redis for shared rate limit tests
        run: sudo apt-get update -q && sudo apt-get install -y -q redis-server
      - name: Check source and installed package
        env:
          BESSEMER_REQUIRE_NATIVE: "1"
          BESSEMER_REQUIRE_REDIS: "1"
        run: ./scripts/check.sh
      - name: Preserve tested wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-python-${{ matrix.python }}-wheel
          path: target/wheels/*.whl
          if-no-files-found: error

  h2spec:
    name: HTTP/2 conformance (h2spec)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: "1"
      RUST_VERSION: "1.92.0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Build and install wheel
        run: |
          python -m pip install --disable-pip-version-check maturin==1.9.6
          maturin build --release --locked --features extension-module --interpreter python --out target/wheels
          python -m pip install --force-reinstall target/wheels/*.whl
      - name: Run h2spec over TLS and plaintext
        run: ./scripts/h2spec.sh
      - name: Preserve h2spec reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h2spec-reports
          path: target/h2spec/*.xml
          if-no-files-found: warn
