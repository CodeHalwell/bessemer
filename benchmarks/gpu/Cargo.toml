[package]
name = "bessemer-gpu-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[workspace]

[dependencies]
bytemuck = { version = "=1.25.2", features = ["extern_crate_alloc"] }
matrixmultiply = "=0.3.11"
pollster = "=1.0.1"
serde_json = "1"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["vulkan"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["dx12", "vulkan"] }

[profile.release]
lto = "thin"
