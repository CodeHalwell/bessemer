[package]
name = "bessemer-m0"
version = "1.0.0-rc.1"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
members = ["crates/bessemer-ffi", "crates/bessemer-codec", "crates/bessemer-loop"]
resolver = "3"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
axum = "0.8"
# No `auto-initialize` here: it requires a shared libpython, which the static
# manylinux interpreters used for release wheels do not ship. Tests get it
# through the dev-dependency below; the M0 binary initializes Python itself.
pyo3 = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
serde_urlencoded = "0.7"
form_urlencoded = "1"
bytes = "1"
http-body = "1"
http-body-util = "0.1"
httparse = "1"
httpdate = "1"
# The same matcher axum 0.8 uses, so route syntax and precedence are unchanged.
matchit = "=0.8.4"
percent-encoding = "2"
itoa = "1"
bessemer-codec = { path = "crates/bessemer-codec" }
bessemer-ffi = { path = "crates/bessemer-ffi" }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tower = { version = "0.5", features = ["util"] }
ipnet = "2"
subtle = "2"
memchr = "2"
mime = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
mimalloc = { version = "0.1", default-features = false }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
brotli = { version = "9.1.1", default-features = false, features = ["std"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# The Rust asyncio event loop (`event_loop = "bessemer"`): epoll on Linux,
# kqueue on macOS.
bessemer-loop = { path = "crates/bessemer-loop" }

[dev-dependencies]
pyo3 = { version = "0.29", features = ["auto-initialize"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# Paused time for the request deadline queue tests.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
# Whole-program optimisation across the server, codec and dependency crates.
# Per-request work crosses many small generic functions (hyper, axum, tokio,
# http), which only inline across crate boundaries with LTO and one codegen unit.
lto = "fat"
codegen-units = 1
