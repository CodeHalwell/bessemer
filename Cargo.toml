[package]
name = "bessemer-m0"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
pyo3 = { version = "0.29", features = ["auto-initialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
